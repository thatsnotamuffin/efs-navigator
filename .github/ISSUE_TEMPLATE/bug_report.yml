name: Bug Report YAML
description: Report a bug or unexpected behavior
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please provide details below. Include screenshots where relevant.

  - type: checkboxes
    id: component
    attributes:
      label: Application Component
      description: Which part of EFS Navigator does this affect?
      options:
        - label: Authentication & Login
        - label: Directory Navigation
        - label: File Viewing & Preview
        - label: File Download
        - label: User Interface
        - label: Performance
        - label: Configuration
        - label: Logging & Monitoring
        - label: Security
        - label: Other

  - type: input
    id: other_component
    attributes:
      label: Other Component
      description: If you selected "Other" above, please specify
      placeholder: Describe the component(s) not listed above
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened?
      placeholder: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this? Included screenshots if possible.
      placeholder: |
        1. Go to...
        2. Click on...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, deployment mode (dev/prod)
      placeholder: |
        - Browser: Chrome 120
        - OS: Ubuntu 22.04
        - Mode: Production
        - Running in a container (Y/N): Yes
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Any error messages or logs? Please scrub any sensitive information from the logs. E.g. IP Address 10.x.x.x
      render: shell
    validations:
      required: false
